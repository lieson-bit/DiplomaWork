services:
  customer-db:
    image: mysql:8.0
    container_name: customer-db-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: customer_service_db
      MYSQL_USER: customer_user
      MYSQL_PASSWORD: customer_pass
    ports:
      - "3309:3306"
    volumes:
      - customer-mysql-data:/var/lib/mysql
      - ./src/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  customer-mysql-data: